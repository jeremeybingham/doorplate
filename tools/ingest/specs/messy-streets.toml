# MessyStreets (Gaere and von Wangenheim, SIGSPATIAL '26; github.com/EdGaere/MessyStreets): three
# 10,000-record tiers of verbatim web addresses from the December 2024 Web Data Commons extract
# (schema.org markup), multinational. Terms and the owner's decision: local-data/messy-streets/NOTICE.md.
# Only the US-like rows are kept: an explicit US country, or no country and a two-letter state with a
# ZIP. The tiers do not overlap. gold: existence checked against OpenStreetMap or OpenAddresses and
# components judged by an LLM; silver: existence only; raw: a random sample, neither. The fields are
# the page's own markup, not hand-checked labels. streetAddress can hold newlines (line 1 and line 2
# are its first two lines; a third line is dropped and counted in the NOTICE). The street name of the
# existence record (OpenAddresses `street`, OSM `street_name`) is label_name, gold and silver only.
# gold and silver are held-out checks: never read their rows, never queue them (docs/data-policy.md).
source = "messy-streets"
output = "local-data/messy-streets/records.parquet"

[inputs.s]
files = ["local-data/messy-streets/release_gold_10k_final.jsonl.gz",
         "local-data/messy-streets/release_silver_10k_final.jsonl.gz",
         "local-data/messy-streets/release_raw_10k_final.jsonl.gz"]
sql = """
WITH t AS (
  SELECT 'gold' AS tier, json AS j FROM read_ndjson_objects('local-data/messy-streets/release_gold_10k_final.jsonl.gz')
  UNION ALL
  SELECT 'silver', json FROM read_ndjson_objects('local-data/messy-streets/release_silver_10k_final.jsonl.gz')
  UNION ALL
  SELECT 'raw', json FROM read_ndjson_objects('local-data/messy-streets/release_raw_10k_final.jsonl.gz')
), f0 AS (
  SELECT tier,
         json_extract_string(j, '$.id') AS id,
         json_extract_string(j, '$.aux.address.streetAddress') AS street,
         json_extract_string(j, '$.aux.address.addressLocality') AS city,
         json_extract_string(j, '$.aux.address.addressRegion') AS state,
         json_extract_string(j, '$.aux.address.postalCode') AS zip,
         upper(trim(coalesce(json_extract_string(j, '$.aux.address.addressCountry'), ''))) AS country,
         coalesce(json_extract_string(j, '$.aux.existence.address.payload.street'),
                  json_extract_string(j, '$.aux.existence.address.payload.street_name')) AS existing_street
  FROM t
), f1 AS (
  -- HTML entities decoded (&amp; &#39; ...), then trimmed; the markup's literal missing-value strings
  -- (nan, null, none, undefined, n/a: a data pipeline wrote them for a missing field) become null, so a
  -- parser is never handed `IL NaN` (#323, review of the raw tier, 2026-11-01)
  SELECT tier, id, country, existing_street,
         trim(replace(replace(replace(replace(replace(replace(street, '&amp;', '&'), '&#39;', chr(39)), '&quot;', '"'), '&lt;', '<'), '&gt;', '>'), '&nbsp;', ' ')) AS street,
         trim(replace(replace(replace(replace(replace(replace(city, '&amp;', '&'), '&#39;', chr(39)), '&quot;', '"'), '&lt;', '<'), '&gt;', '>'), '&nbsp;', ' ')) AS city,
         trim(replace(replace(replace(replace(replace(replace(state, '&amp;', '&'), '&#39;', chr(39)), '&quot;', '"'), '&lt;', '<'), '&gt;', '>'), '&nbsp;', ' ')) AS state,
         trim(replace(replace(replace(replace(replace(replace(zip, '&amp;', '&'), '&#39;', chr(39)), '&quot;', '"'), '&lt;', '<'), '&gt;', '>'), '&nbsp;', ' ')) AS zip
  FROM f0
), f AS (
  SELECT tier, id, country, existing_street,
         nullif(street, '') AS street,
         CASE WHEN lower(city) IN ('nan', 'null', 'none', 'undefined', 'n/a') THEN NULL ELSE nullif(city, '') END AS city,
         CASE WHEN lower(state) IN ('nan', 'null', 'none', 'undefined', 'n/a') THEN NULL ELSE nullif(state, '') END AS state,
         CASE WHEN lower(zip) IN ('nan', 'null', 'none', 'undefined', 'n/a') THEN NULL ELSE nullif(zip, '') END AS zip
  FROM f1
)
SELECT * FROM f
WHERE country IN ('US', 'USA', 'UNITED STATES', 'UNITED STATES OF AMERICA')
   OR (country = '' AND regexp_matches(coalesce(state, ''), '^[A-Za-z]{2}$')
       AND regexp_matches(coalesce(zip, ''), '^[0-9]{5}(-[0-9]{4})?$'))
"""

[[roles]]
role = "gold"
sql = """
SELECT id AS record_id, 'gold' AS provider,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[1]), '') AS line1,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[2]), '') AS line2,
       city, state, zip, nullif(trim(existing_street), '') AS label_name
FROM s WHERE tier = 'gold' AND street IS NOT NULL
"""

[[roles]]
role = "silver"
sql = """
SELECT id AS record_id, 'silver' AS provider,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[1]), '') AS line1,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[2]), '') AS line2,
       city, state, zip, nullif(trim(existing_street), '') AS label_name
FROM s WHERE tier = 'silver' AND street IS NOT NULL
"""

# The work list: a random sample of the pool, no existence check, no street-name label.
[[roles]]
role = "raw"
sql = """
SELECT id AS record_id, 'raw' AS provider,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[1]), '') AS line1,
       nullif(trim(string_split(replace(street, chr(13), ''), chr(10))[2]), '') AS line2,
       city, state, zip
FROM s WHERE tier = 'raw' AND street IS NOT NULL
"""
