[package]
name = "doorplate"
description = "US address parser: components, USPS Pub 28 and RESO output, a match key and a slug. Pure Rust; does not validate deliverability."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["address", "parser", "usps", "reso", "normalization"]
categories = ["parser-implementations", "text-processing"]
rust-version.workspace = true

[features]
default = ["places-us"]
# National place list (data/places/, docs/places.md): places and ZIPs for every
# state, DC and Puerto Rico, under the curated state data (data/states/).
places-us = []
# Parallel `Parser::parse_many`.
rayon = ["dep:rayon"]
# Golden-corpus loader and runner (`doorplate::corpus`), used by the corpus
# test and `doorplate corpus test`. Pulls in serde; the default build has no
# dependencies.
corpus = ["dep:serde", "dep:serde_json"]
# Custom layers (`doorplate::CustomLayer::from_sources`, #3): your own spellings and word lists,
# loaded at run time. Pulls in the `toml` parser; the default build has no dependencies.
custom-layer = ["dep:toml"]

[lints]
workspace = true

[dependencies]
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }

[build-dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }

# docs.rs builds the documentation with every feature, so the custom layer and the corpus runner show.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
# The corpus test needs the `corpus` feature; enabling it through a
# self-dev-dependency keeps a plain `cargo test` running it.
doorplate = { path = ".", features = ["corpus", "custom-layer"] }
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false
