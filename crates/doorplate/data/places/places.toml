# National place list (docs/places.md; layer 2 of the lexicon).
#
# places.tsv  state, name, county, kind (municipality | place | subdivision),
#             sources (census | geonames), variants (`;`-separated)
# zips.tsv    zip, state, place (GeoNames' place for the ZIP; always a row of
#             places.tsv)
#
# Both are generated by tools/places/build_us.py from the files named below;
# do not edit them by hand. This file is written by hand, and so are the two curated files:
#
# curated_places.tsv  state, name, county, kind (municipality | place), variants (`;`-separated
#             spellings, mostly typos seen in real data), evidence (where the row comes from)
# curated_zips.tsv    zip, state, place, shared, evidence. A row with a `place` gives the ZIP's main
#             place and the places it shares (`;`-separated) and comes first for its ZIP; a later
#             row for the same ZIP with an empty `place` adds one shared place seen in real data
#
# Curated rows go in first and win: a national row whose name or ZIP a curated state already has
# is dropped. Each addition names its evidence (docs/places.md, "Curated rows").

version = "2026.10.1"
# States where a ZIP's shared places were collected, so `zip_city_mismatch` can be raised for them.
zip_city_check = ["FL"]
states = "50 states, DC and Puerto Rico"
sources = [
  "US Census Bureau 2024 Gazetteer, places, county subdivisions and counties (public domain)",
  "US Census Bureau 2020 place-by-county and county-subdivision reference lists (public domain)",
  "GeoNames postal codes, US.zip and PR.zip, downloaded 2026-10-16 (CC BY 4.0)",
  "Curated rows (Florida): curated by the authors from county listings (MIT OR Apache-2.0), the sources above, Florida public-record address export 2025-10-10, Florida DBPR licensee files 2026-10-18 (public record, Chapter 119)",
]
