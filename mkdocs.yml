site_name: doorplate
site_description: Parse US addresses into components, USPS Publication 28 and RESO output, with a match key and diagnostics. It formats and parses; it does not validate that an address exists or can receive mail.
site_url: https://doorplate.readthedocs.io/
repo_url: https://github.com/jeremeybingham/doorplate
repo_name: jeremeybingham/doorplate
edit_uri: edit/main/docs/

docs_dir: docs
# Not the default `site/`: that folder is the blog and the live demo (Jekyll), and a build cleans its output folder.
site_dir: build/docs
exclude_docs: |
  requirements.txt
  /README.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

# GitHub and the site show the same Markdown. Links out of docs/ go to GitHub (tools/docs/links.py).
hooks:
  - tools/docs/links.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The stubs and the pure-Python helpers are read as source; nothing is built or imported.
          paths: [crates/doorplate-py/python]
          options:
            docstring_style: null
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            filters: ["!^_[^_]"]

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn       # a page in docs/ that is not in the nav fails the strict build
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# docs/index.md is the home page. docs/README.md is the index for GitHub readers and is not part of the site.
# A page added to docs/ needs a nav entry here and a row in docs/README.md.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - About:
      - How it works: how-it-works.md
      - Warnings: warnings.md
      - The match key: key-format.md
      - Accuracy: benchmarks.md
      - Speed, size and memory: speed-and-size.md
      - RESO mapping: reso-mapping.md
      - USPS Publication 28 notes: usps-pub28-notes.md
  - Guides:
      - pandas, Polars and DuckDB: dataframes.md
      - Custom layers: custom-layers.md
      - Anonymizing data: anonymizing.md
      - Coming from usaddress: usaddress-compat.md
  - Python:
      - Python guide: python.md
      - Python reference: python-api.md
      - Examples: https://github.com/jeremeybingham/doorplate/tree/main/examples
  - Command line:
      - Command-line guide: command-line.md
      - Command-line reference: cli.md
  - Rust:
      - Rust guide: rust.md
      - API on docs.rs: https://docs.rs/doorplate
  - Data:
      - Data policy: data-policy.md
      - Places: places.md
      - State data: states/README.md
      - Florida: states/fl.md
      - Notice and licenses: https://github.com/jeremeybingham/doorplate/blob/main/NOTICE
  - Development:
      - When you change something: change-checklist.md
      - Contributing: https://github.com/jeremeybingham/doorplate/blob/main/CONTRIBUTING.md
      - Tools:
          - The harness: tools/harness.md
          - Harness run columns: tools/harness-schema.md
          - The review tool: tools/review.md
          - The ingest tool: tools/ingest.md
      - Repository layout and tests: repository.md
      - Tests:
          - The golden corpus: tests/corpus.md
          - usaddress test files: tests/usaddress-tests.md
      - Benchmarks:
          - Running the benchmarks: running-benchmarks.md
          - The benchmark suite: benchmark-suite.md
      - Project:
          - Roadmap: roadmap.md
          - Backlog: backlog.md
          - API surface: api-surface.md
          - Changelog: https://github.com/jeremeybingham/doorplate/blob/main/CHANGELOG.md
