[workspace]
resolver = "2"
members = ["crates/doorplate", "crates/doorplate-cli", "crates/doorplate-py", "crates/doorplate-wasm"]

[workspace.package]
version = "0.5.2-dev"
edition = "2021"
authors = ["Jeremey Bingham <38598572+jeremeybingham@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeremeybingham/doorplate"
homepage = "https://github.com/jeremeybingham/doorplate"
rust-version = "1.80"

# One place for the core crate's version, so the dependents that are published
# (doorplate-cli) name it as crates.io requires. Keep it equal to
# `workspace.package.version`.
[workspace.dependencies]
doorplate = { path = "crates/doorplate", version = "0.5.2-dev" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Fat LTO and one codegen unit: about 3% fewer instructions per parse, a smaller CLI and wheel,
# about 2.3 times the release build time (#421, `docs/speed-and-size.md`).
[profile.release]
lto = "fat"
codegen-units = 1
