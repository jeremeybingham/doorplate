name: Pages
# Builds the Jekyll site in `site/` and deploys it to GitHub Pages. Needs the
# repository setting Pages > Source: "GitHub Actions". Drafts in `site/_drafts/`
# are not built.
on:
  push:
    branches: [main]
    # The demo page runs the parser, so a change to it, to the wasm crate or to
    # the JSON builder it shares with the command-line tool rebuilds the site.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "crates/doorplate/**"
      - "crates/doorplate-wasm/**"
      - "crates/doorplate-cli/src/json.rs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jeremeybingham/doorplate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the parser for the demo page (site/demo/doorplate.wasm)
        run: |
          cargo build -p doorplate-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/doorplate_wasm.wasm site/demo/doorplate.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
