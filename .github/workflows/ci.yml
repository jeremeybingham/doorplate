name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Golden corpus accuracy report
        run: cargo test -p doorplate --test corpus -- --nocapture
      - name: Corpus emitter expectations agree with emit_expect.py
        run: python3 tools/corpus/emit_expect.py --check tests/corpus/*.jsonl
      - name: The crate packages and builds on its own (the tables are inside it)
        run: cargo package -p doorplate
      - name: The live demo builds for WebAssembly (the page itself is built by the Pages workflow)
        run: cargo build -p doorplate-wasm --target wasm32-unknown-unknown --release
      - name: Each package carries the same license files and NOTICE as the repository root
        run: |
          for d in crates/doorplate crates/doorplate-cli crates/doorplate-py; do
            for f in LICENSE-MIT LICENSE-APACHE NOTICE; do cmp "$f" "$d/$f"; done
          done

  # Line coverage of the Rust code, uploaded to Codecov. A separate job: the instrumented rebuild
  # takes a few minutes and must not slow the `rust` job. Informational only (see codecov.yml).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A missing token or a Codecov outage never fails a pull request.
          fail_ci_if_error: false

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The source distribution builds and parses in a clean environment
        run: |
          python -m venv build-env && . build-env/bin/activate
          pip install maturin
          maturin sdist -m crates/doorplate-py/Cargo.toml -o dist-sdist
          python -m venv clean-env
          clean-env/bin/pip install dist-sdist/*.tar.gz
          clean-env/bin/python -c "import doorplate as d; a = d.parse('123 N Main St Apt 4, Miami FL 33101'); assert a.key() == 'k4:S|123|N|MAIN|ST||FL|33101', a.key(); assert a.place['name'] == 'MIAMI'"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # rust-toolchain.toml pins stable, so name nightly explicitly.
      - name: Short smoke run of each target
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run parse -- -max_total_time=30 -max_len=200
          cargo +nightly fuzz run parse_fields -- -max_total_time=30 -max_len=200

  # The documentation site (mkdocs.yml, built on Read the Docs). Strict: a broken link, a missing anchor or a
  # page that is in docs/ but not in the nav fails the pull request.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt pytest
      - run: mkdocs build --strict
      - run: python -m pytest tools/docs -q

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the extension and run the Python tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest usaddress pandas polars duckdb pyarrow nbclient nbformat ipykernel
          maturin develop --manifest-path crates/doorplate-py/Cargo.toml
          pytest crates/doorplate-py/tests -q
      - name: Test the ingest tool, the harness and the review tool (tools/ingest, tools/harness, tools/review; Python 3.11+)
        if: matrix.python != '3.10'
        run: |
          . .venv/bin/activate
          pytest tools/ingest tools/harness tools/review tools/compare -q
